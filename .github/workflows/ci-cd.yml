name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SA_PASSWORD: Ci-Test-Passw0rd-2026
  TEST_CONNECTION: Server=localhost,1433;Database=VerificationHubDB;User Id=sa;Password=Ci-Test-Passw0rd-2026;TrustServerCertificate=True;

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs sql
          exit 1

      - name: Create the database schema and procedures
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet restore backend/backend.Api.csproj
          ASPNETCORE_ENVIRONMENT=Development dotnet ef migrations script --idempotent --project backend -o schema.sql
          sqlcmd() { docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b -I "$@"; }
          sqlcmd -Q "CREATE DATABASE VerificationHubDB"
          docker cp schema.sql sql:/tmp/schema.sql
          docker cp database/Procedures.sql sql:/tmp/Procedures.sql
          sqlcmd -d VerificationHubDB -i /tmp/schema.sql
          sqlcmd -d VerificationHubDB -i /tmp/Procedures.sql

      - name: Backend tests
        run: dotnet test backend.Tests --configuration Release
        env:
          ConnectionStrings__DefaultConnection: ${{ env.TEST_CONNECTION }}

      - name: Install frontend packages
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
        working-directory: frontend

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the Angular app into the API
        run: |
          npm ci
          npx ng build
          mkdir -p ../backend/wwwroot
          cp -r dist/frontend/browser/. ../backend/wwwroot/
        working-directory: frontend

      - name: Publish the API
        run: dotnet publish backend/backend.Api.csproj --configuration Release --output publish-out

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish-out
