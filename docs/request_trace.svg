<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2310 1150" width="2310" height="1150" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="One form submit travels from the Angular app through the App Service API, where Vendor.CheckCountryTier raises a ClosedJurisdiction flag, and is saved to Azure SQL in one transaction.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#111"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#c2410c"/></marker></defs>
<rect width="2310" height="1150" fill="#ffffff"/>
<text x="40" y="40" font-size="32" font-weight="700" fill="#111" text-anchor="start" dominant-baseline="central" >One request through the layers: an admin submits a customer whose country of residence is FR</text>
<rect x="360" y="100" width="1920" height="980" rx="24" fill="#f3f8ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="14 10"/>
<text x="390" y="128" font-size="22" font-weight="600" fill="#2563eb" text-anchor="start" dominant-baseline="central" >Azure · resource group rg-verificationhub-dev-northcentralus-01</text>
<text x="40" y="248" font-size="20" font-weight="600" fill="#555" text-anchor="start" dominant-baseline="central" >Outside Azure</text>
<rect x="40" y="270" width="290" height="520" rx="14" fill="#fafafa" stroke="#111" stroke-width="3"/>
<text x="185" y="300" font-size="24" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="central" >Admin's browser</text>
<text x="185" y="330" font-size="19" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="central" >Angular app · inputForm</text>
<text x="60" y="385" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >Submits the form with</text>
<text x="60" y="415" font-size="20" font-weight="700" fill="#c2410c" text-anchor="start" dominant-baseline="central" >Country of residence = FR</text>
<line x1="60" y1="470" x2="310" y2="470" stroke="#bbb" stroke-width="2"/>
<text x="60" y="505" font-size="19" font-weight="600" fill="#555" text-anchor="start" dominant-baseline="central" >Receives (step 7)</text>
<text x="60" y="545" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >{ ticketId,</text>
<text x="60" y="575" font-size="19" font-weight="400" fill="#c2410c" text-anchor="start" dominant-baseline="central" >riskRating: "Medium",</text>
<text x="60" y="605" font-size="19" font-weight="400" fill="#c2410c" text-anchor="start" dominant-baseline="central" >flags: [</text>
<text x="60" y="635" font-size="19" font-weight="400" fill="#c2410c" text-anchor="start" dominant-baseline="central" >"ClosedJurisdiction"] }</text>
<text x="60" y="700" font-size="19" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="central" >then navigates to</text>
<text x="60" y="728" font-size="19" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="central" >/review/{ticketId}</text>
<rect x="700" y="170" width="640" height="830" rx="14" fill="#fff" stroke="#111" stroke-width="3.5"/>
<text x="1020" y="205" font-size="22" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="central" >App Service · web-verificationhub-dev-cus-001</text>
<text x="1020" y="233" font-size="18" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="central" >ASP.NET Core API, Angular build served from wwwroot (same origin)</text>
<rect x="740" y="270" width="560" height="110" rx="14" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="765" y="298" font-size="21" font-weight="700" fill="#111" text-anchor="start" dominant-baseline="central" >Request pipeline</text>
<text x="765" y="330" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >HTTPS → ForwardedHeaders → cookie auth</text>
<text x="765" y="358" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >→ [Authorize] passes</text>
<rect x="740" y="440" width="560" height="310" rx="14" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="765" y="468" font-size="21" font-weight="700" fill="#111" text-anchor="start" dominant-baseline="central" >InputFormController.inputForm</text>
<text x="765" y="510" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >validate input · hash tax ID</text>
<text x="765" y="565" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >save Customer, then Ticket (Review)</text>
<text x="765" y="625" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >run the vendor checks (steps 4–5)</text>
<text x="765" y="735" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >save VendorResponse, Flags, AuditTrails · COMMIT</text>
<rect x="740" y="830" width="560" height="145" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3.5"/>
<text x="765" y="858" font-size="21" font-weight="700" fill="#c2410c" text-anchor="start" dominant-baseline="central" >Vendor.CheckCountryTier</text>
<text x="765" y="892" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >CountryOfResidence ∉ { US, MX }</text>
<text x="765" y="922" font-size="19" font-weight="600" fill="#c2410c" text-anchor="start" dominant-baseline="central" >→ new Flag(ClosedJurisdiction)</text>
<text x="765" y="952" font-size="19" font-weight="600" fill="#c2410c" text-anchor="start" dominant-baseline="central" >→ Raise("Medium") risk rating</text>
<rect x="1760" y="420" width="480" height="440" rx="14" fill="#fff" stroke="#111" stroke-width="3.5"/>
<text x="2000" y="448" font-size="22" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="central" >Azure SQL Database</text>
<text x="2000" y="474" font-size="18" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="central" >VerificationHubDB</text>
<rect x="1810" y="510" width="400" height="50" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="1830" y="535" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >Customers</text>
<rect x="1810" y="570" width="400" height="50" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="1830" y="595" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >Tickets (status Review)</text>
<rect x="1810" y="650" width="400" height="50" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="1830" y="675" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >VendorResponses</text>
<rect x="1810" y="710" width="400" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="1830" y="735" font-size="19" font-weight="600" fill="#c2410c" text-anchor="start" dominant-baseline="central" >Flags ← ClosedJurisdiction</text>
<rect x="1810" y="770" width="400" height="50" rx="8" fill="#fafafa" stroke="#111" stroke-width="2.5"/>
<text x="1830" y="795" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >AuditTrails ×2</text>
<polyline points="1795,510 1785,510 1785,620 1795,620" fill="none" stroke="#111" stroke-width="3"/>
<polyline points="1795,650 1785,650 1785,820 1795,820" fill="none" stroke="#111" stroke-width="3"/>
<text x="2000" y="845" font-size="16" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" ></text>
<polyline points="330,330 740,330" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="390" cy="330" r="17" fill="#111"/>
<text x="390" y="331" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >1</text>
<text x="420" y="300" font-size="19" font-weight="600" fill="#111" text-anchor="start" dominant-baseline="central" >POST /api/admins/inputForm</text>
<text x="420" y="360" font-size="19" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="central" >JSON body + session cookie</text>
<polyline points="1020,380 1020,440" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="1000" cy="410" r="17" fill="#111"/>
<text x="1000" y="411" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >2</text>
<text x="1030" y="410" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >admin name from cookie</text>
<polyline points="1300,565 1785,565" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="1375" cy="565" r="17" fill="#111"/>
<text x="1375" y="566" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >3</text>
<text x="1400" y="535" font-size="19" font-weight="600" fill="#111" text-anchor="start" dominant-baseline="central" >INSERT Customer, Ticket</text>
<text x="1400" y="595" font-size="19" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="central" >(in one transaction)</text>
<polyline points="900,750 900,830" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="900" cy="790" r="17" fill="#111"/>
<text x="900" y="791" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >4</text>
<text x="925" y="790" font-size="19" font-weight="400" fill="#111" text-anchor="start" dominant-baseline="central" >(customer, ticketId)</text>
<polyline points="1130,830 1130,750" fill="none" stroke="#c2410c" stroke-width="3.5" marker-end="url(#ac)"/>
<circle cx="1130" cy="790" r="17" fill="#c2410c"/>
<text x="1130" y="791" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >5</text>
<text x="1155" y="790" font-size="19" font-weight="600" fill="#c2410c" text-anchor="start" dominant-baseline="central" >Flag + Medium</text>
<polyline points="1300,735 1785,735" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="1375" cy="735" r="17" fill="#111"/>
<text x="1375" y="736" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >6</text>
<text x="1400" y="690" font-size="19" font-weight="600" fill="#111" text-anchor="start" dominant-baseline="central" >INSERT VendorResponse,</text>
<text x="1400" y="715" font-size="19" font-weight="600" fill="#111" text-anchor="start" dominant-baseline="central" >Flag, AuditTrail ×2 · COMMIT</text>
<polyline points="740,640 330,640" fill="none" stroke="#111" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="390" cy="640" r="17" fill="#111"/>
<text x="390" y="641" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" >7</text>
<text x="420" y="610" font-size="19" font-weight="600" fill="#111" text-anchor="start" dominant-baseline="central" >200 OK + JSON</text>
<text x="40" y="1112" font-size="21" font-weight="600" fill="#c2410c" text-anchor="start" dominant-baseline="central" >Orange = the closed-jurisdiction decision. It is made in the API's Vendor class; the database only stores the result.</text>
</svg>