<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification Onboarding Hub</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form action="/submit-path" method="POST">
        <div class="my-box">
            <h1>User Information Form</h1>
            <div class="fields">
            <label for="First Name">First Name:</label>
            <input type="text" id="FirstName" name="FirstName" placeholder="Enter your first name" required>
            </div>
            
            <div class="fields">
            <label for="Middle Name">Middle Name:</label>
            <input type="text" id="MiddleName" name="MiddleName" placeholder="Enter your middle name" required>
            </div>

            <div class="fields">
            <label for="Last Name">Last Name:</label>
            <input type="text" id="LastName" name="LastName" placeholder="Enter your last name" required>
            </div>

            <div class="fields">
            <label for="DateOfBirth">Date of Birth:</label>
            <input type="date" id="DateOfBirth" name="DateOfBirth" required>
            </div>

            <div class="fields">
            <label for="Gender">Gender:</label>
            <input type="radio" id="male" name="Gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="Gender" value="female" required>
            <label for="female">Female</label>
            <input type="radio" id="other" name="Gender" value="other" required>
            <label for="other">Other</label>
            </div>

            <div class="fields">
            <label for="taxIdType">Tax ID Type:</label>
            <input type="text" id="taxIdType" name="taxIdType" placeholder="What tax ID type do you have?" required>
            </div>

            <div class="fields">
            <label for="taxIdNumber">Tax ID Number:</label>
            <input type="text" id="taxIdNumber" name="taxIdNumber" placeholder="Enter your tax ID number" required>
            </div>

            <div class="fields">
            <label for="residentialAddress">Residential Address:</label>
            <input type="text" id="residentialAddress" name="residentialAddress" placeholder="Enter your residential address" required>
            </div>

            <div class="fields">
            <label for="countryOfResidence">Country of Residence:</label>
            <input type="text" id="countryOfResidence" name="countryOfResidence" placeholder="Enter your country of residence" required>
            </div>

            <div class="fields">
            <label for="countryOfCitizenship">Country of Citizenship:</label>
            <input type="text" id="countryOfCitizenship" name="countryOfCitizenship" placeholder="Enter your country of citizenship" required>
            </div>

            <div class="fields">
            <label for="occupation">Occupation:</label>
            <input type="text" id="occupation" name="occupation" placeholder="What is your occupation?" required>
            </div>

            <div class="fields">
            <label for="Employer">Employer:</label>
            <input type="text" id="Employer" name="Employer" placeholder="What is your employer?" required>
            </div>

            <div class="fields">
            <button type="submit">Submit</button>
            </div>
        </div>
    </form>
</body>
</html>
