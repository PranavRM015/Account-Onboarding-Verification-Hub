<div class="home">
    <h1 class="text">Welcome to the Account Onboarding Verification Hub!</h1>
    <p>Who are you signing in as?</p>
    <div class="cards">
        <section class="card" id="userCard">
            <h2>User</h2>
            <p>Customers opening an account.</p>
            <a class="card-button" id="userLoginButton" routerLink="/user/login">Log in as user</a>
            <a class="card-button outline" id="userSignupButton" routerLink="/user/signup">Sign up as user</a>
        </section>
        <section class="card" id="adminCard">
            <h2>Admin</h2>
            <p>Staff who review and approve onboarding.</p>
            <a class="card-button" id="adminLoginButton" routerLink="/admin/login">Log in as admin</a>
            <a class="card-button outline" id="adminSignupButton" routerLink="/admin/signup">Sign up as admin</a>
        </section>
    </div>
</div>
