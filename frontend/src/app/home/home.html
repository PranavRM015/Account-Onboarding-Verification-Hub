<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>

<div class="my-box">
  <h1 class="text">Welcome to the Account Onboarding Verification Hub!</h1>
  <div class="choices">
    <div class="choice">
      <span>Signup</span>
      <br>
      <span>Login</span>
    </div>
    <div class="choice">
      <button type="button" id="signupButton" routerLink="/signup">Sign up</button>
      <br>
      <button type="button" id="loginButton" routerLink="/login">Log in</button>
    </div>
  </div>
</div>
