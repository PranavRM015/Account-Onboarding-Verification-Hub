<div class="home">
    <a class="back" id="backButton" routerLink="/">
        <span aria-hidden="true">←</span>
        Back to Customer and Admin selection
    </a>
    <h1 class="text">{{ title }} access</h1>
    <p>{{ blurb }}</p>
    <div class="access-actions">
        <a class="button" id="loginButton" [routerLink]="'/' + role + '/login'">Log in</a>
        <div class="signup-divider">New here?</div>
        <a class="button secondary" id="signupButton" [routerLink]="'/' + role + '/signup'">Sign up</a>
    </div>
</div>
